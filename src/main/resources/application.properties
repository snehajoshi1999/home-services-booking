spring.application.name=home-services-booking
server.port=8080

# MySQL - the database is created automatically if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/home_services_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA - tables are created/updated from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
